<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEIL · anonymous rooms</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#07060d;--panel:#100e1c;--line:#241f3d;--text:#e6e3f5;--dim:#8a85a8;--acc:#9b7bff;--acc2:#5eead4;--me:#2a1f5c}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:radial-gradient(900px 500px at 50% -10%,#1a1240 0,var(--bg) 60%) var(--bg);color:var(--text);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.view{height:100%;display:none;flex-direction:column}
.view.on{display:flex}
#join{align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{font-size:44px;letter-spacing:.5em;margin:0 0 4px .5em;font-weight:300;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px #9b7bff55}
.tag{color:var(--dim);margin:0 0 32px;letter-spacing:.15em;font-size:12px;text-transform:uppercase}
.card{width:100%;max-width:360px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 60px #6d4aff22}
label{text-align:left;font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
input{width:100%;background:#0a0814;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px #9b7bff22}
button{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;color:#0b0818;background:linear-gradient(90deg,var(--acc),var(--acc2))}
button:hover{filter:brightness(1.1)}
button.ghost{background:none;color:var(--dim);border:1px solid var(--line);padding:6px 12px;font-weight:400}
.err{color:#ff8fa3;font-size:13px;min-height:18px;margin:0}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header .code{font-family:ui-monospace,Menlo,monospace;color:var(--acc2);letter-spacing:.2em}
header .sp{flex:1}
#count{color:var(--dim);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc2);margin-right:6px;box-shadow:0 0 8px var(--acc2)}
.dot.off{background:#ff8fa3;box-shadow:none}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.sys{align-self:center;color:var(--dim);font-size:12px;font-style:italic}
.msg{max-width:min(78%,520px);align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px}
.msg.me{align-self:flex-end;background:var(--me);border-color:#4b3a9c;border-radius:14px 14px 4px 14px}
.who{font-size:11px;color:var(--acc);letter-spacing:.06em;margin-bottom:2px}
.me .who{color:var(--acc2)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
#typing{height:22px;padding:0 18px;font-size:12px;color:var(--acc2);font-style:italic;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#typing i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:var(--acc2);animation:b 1.2s infinite}
#typing i:nth-child(3){animation-delay:.2s}#typing i:nth-child(4){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.sys.join{color:var(--acc2);font-style:normal;background:#5eead411;border:1px solid #5eead433;border-radius:20px;padding:3px 12px}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel)}
form input{flex:1}
</style>
</head>
<body>
<section id="join" class="view on">
  <h1 class="logo">VEIL</h1>
  <p class="tag">speak freely · leave no trace</p>
  <div class="card">
    <label for="user">Alias</label>
    <input id="user" maxlength="20" placeholder="e.g. Phantom" autocomplete="off">
    <label for="code">Room code</label>
    <input id="code" maxlength="24" placeholder="enter or invent a code" autocomplete="off">
    <p class="err" id="err"></p>
    <button id="go">Enter the room</button>
  </div>
</section>

<section id="chat" class="view">
  <header>
    <button class="ghost" id="leave">←</button>
    <span class="code" id="rc"></span>
    <span class="sp"></span>
    <span id="count"><span class="dot" id="dot"></span><span id="n">1</span> here</span>
  </header>
  <div id="log"></div>
  <div id="typing"></div>
  <form id="f">
    <input id="m" maxlength="500" placeholder="Whisper into the dark…" autocomplete="off">
    <button>Send</button>
  </form>
</section>

<script>
/* ===== CONFIG: paste your Supabase values here (Project Settings → API) ===== */
const SUPABASE_URL = "https://jbdmwrmijwmyybmrympa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_og0mt3cJE9tir9r4foRowQ_4XZHr89l";
/* ============================================================================ */

const $=id=>document.getElementById(id);
const myId=Math.random().toString(36).slice(2)+Date.now().toString(36);
let sb=null,ch=null,myName='',lastTyping=0,firstSync=true;
const typers={};
function renderTyping(){
  const n=Object.values(typers).map(t=>t.name),el=$('typing');
  if(!n.length){el.textContent='';return}
  el.textContent=(n.length===1?n[0]+' is typing':n.length===2?n[0]+' and '+n[1]+' are typing':'Several people are typing');
  el.insertAdjacentHTML('beforeend','<i></i><i></i><i></i>');
}
function stopTyper(id){if(typers[id]){clearTimeout(typers[id].to);delete typers[id];renderTyping()}}
const clean=s=>String(s).replace(/[\u0000-\u001f\u200b-\u200f\u2028-\u202e\ufe00-\ufe0f]/g,'').trim();

function sys(t,c){const d=document.createElement('div');d.className='sys'+(c?' '+c:'');d.textContent=t;$('log').appendChild(d);scroll()}
function scroll(){const l=$('log');l.scrollTop=l.scrollHeight}
function add(m){
  const d=document.createElement('div');d.className='msg'+(m.me?' me':'');
  const w=document.createElement('div');w.className='who';w.textContent=m.name;
  const t=document.createElement('div');t.className='txt';t.textContent=m.text;
  d.append(w,t);$('log').appendChild(d);scroll();
}
function show(v){$('join').classList.toggle('on',v==='join');$('chat').classList.toggle('on',v==='chat')}
function reset(){$('go').disabled=false;$('go').textContent='Enter the room'}
const names=ps=>ps.map(p=>clean(p.alias||'')).filter(Boolean).map(n=>n.slice(0,20));

async function enter(){
  const name=clean($('user').value).slice(0,20);
  const code=clean($('code').value).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  if(!name){$('err').textContent='Choose an alias first.';return}
  if(code.length<3){$('err').textContent='Room code needs at least 3 letters or numbers.';return}
  if(SUPABASE_URL.startsWith('YOUR_')||SUPABASE_ANON_KEY.startsWith('YOUR_')){$('err').textContent='Site not configured: add your Supabase URL and key in the page source.';return}
  $('err').textContent='';$('go').disabled=true;$('go').textContent='Opening the door…';
  try{sb=sb||window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){$('err').textContent='Could not start the connection.';reset();return}
  myName=name;firstSync=true;
  ch=sb.channel('veil-'+code,{config:{broadcast:{self:true},presence:{key:myId}}});
  ch.on('broadcast',{event:'chat'},({payload:p})=>{
    if(!p||typeof p.text!=='string')return;
    stopTyper(p.cid);
    add({name:clean(p.name||'anon').slice(0,20)||'anon',text:p.text.slice(0,500),me:p.cid===myId});
  });
  ch.on('broadcast',{event:'typing'},({payload:p})=>{
    if(!p||p.cid===myId||typeof p.cid!=='string')return;
    const n=clean(p.name||'anon').slice(0,20)||'anon';
    if(typers[p.cid])clearTimeout(typers[p.cid].to);
    typers[p.cid]={name:n,to:setTimeout(()=>stopTyper(p.cid),3500)};
    renderTyping();
  });
  ch.on('presence',{event:'sync'},()=>{
    const st=ch.presenceState();
    $('n').textContent=Object.keys(st).length||1;
    if(firstSync){
      firstSync=false;
      const others=Object.entries(st).filter(([k])=>k!==myId).flatMap(([,v])=>names(v));
      sys(others.length?'Already here: '+others.join(', '):'You are the first one here. Share the code to invite others.','join');
    }
  });
  ch.on('presence',{event:'join'},({key,newPresences})=>{if(key===myId)return;names(newPresences).forEach(n=>sys('✦ '+n+' has entered the room','join'))});
  ch.on('presence',{event:'leave'},({key,leftPresences})=>{if(key===myId)return;stopTyper(key);names(leftPresences).forEach(n=>sys(n+' vanished'))});
  let opened=false;
  ch.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
      $('dot').classList.remove('off');
      await ch.track({alias:myName});
      if(!opened){opened=true;$('rc').textContent=code.toUpperCase();$('log').textContent='';show('chat');
        sys('You entered as '+myName+'. Messages vanish when everyone leaves.');$('m').focus();reset()}
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
      $('dot').classList.add('off');
      if(!opened){$('err').textContent='Could not connect. Check your Supabase URL and key.';reset();leaveCh()}
    }
  });
}
function leaveCh(){Object.keys(typers).forEach(stopTyper);if(ch&&sb){sb.removeChannel(ch)}ch=null}
function leave(){leaveCh();show('join')}

$('go').onclick=enter;
[$('user'),$('code')].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')enter()}));
$('leave').onclick=leave;
$('m').addEventListener('input',()=>{
  const now=Date.now();
  if(!ch||!$('m').value.trim()||now-lastTyping<2000)return;
  lastTyping=now;ch.send({type:'broadcast',event:'typing',payload:{name:myName,cid:myId}});
});
$('f').onsubmit=async e=>{
  e.preventDefault();const text=clean($('m').value).slice(0,500);
  if(!text||!ch)return;$('m').value='';lastTyping=0;
  const r=await ch.send({type:'broadcast',event:'chat',payload:{name:myName,text,cid:myId}});
  if(r!=='ok')sys('Message could not be sent.');
};
</script>
</body>
</html>
